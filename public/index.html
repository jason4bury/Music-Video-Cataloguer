<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Music Video Cataloguer</title>
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <h1><img src="icon-64.png" alt="" width="28" height="28" />Music Video Cataloguer</h1>
      <div class="search-wrap">
        <input id="search" type="search" placeholder="Search artist or title…" autocomplete="off" />
      </div>
      <div class="topbar-actions">
        <button id="favToggle" class="chip-toggle" title="Show only favourites" aria-pressed="false">★ Favourites</button>
        <button id="aboutBtn" title="About Music Video Cataloguer">About</button>
        <button id="logoutBtn" title="Sign out">⏻ Sign out</button>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <section>
          <h2>Playlists</h2>
          <ul id="playlistList" class="playlist-list">
            <li data-playlist="" class="active">All Videos</li>
          </ul>
          <form id="newPlaylistForm" class="inline-form">
            <input id="newPlaylistName" placeholder="New playlist…" maxlength="80" aria-label="New playlist name" required />
            <button type="submit" title="Create playlist">+</button>
          </form>
        </section>

        <section>
          <h2>Artists</h2>
          <ul id="artistList" class="filter-list"></ul>
        </section>

        <section>
          <h2>Tags</h2>
          <ul id="tagList" class="filter-list"></ul>
        </section>

        <section id="scanSection" class="hidden">
          <h2>Scan</h2>
          <div class="scan-progress-track">
            <div id="scanProgressFill" class="scan-progress-fill"></div>
          </div>
          <p id="scanProgressLabel" class="scan-progress-label"></p>
        </section>

        <p id="scanWarning" class="scan-warning hidden"></p>
      </aside>

      <main>
        <div class="toolbar">
          <span id="resultCount" class="result-count"></span>
          <label class="sort-label">
            Sort
            <select id="sortSelect">
              <option value="artist">Artist</option>
              <option value="title">Title</option>
              <option value="added">Recently Added</option>
              <option value="duration">Duration</option>
            </select>
          </label>
        </div>
        <div id="grid" class="grid"></div>
        <div id="emptyState" class="empty-state hidden">No videos match your filters yet.</div>
      </main>
    </div>
  </div>

  <div id="playerModal" class="modal hidden">
    <div class="modal-content">
      <button id="closeModal" class="modal-close" title="Close" aria-label="Close">✕</button>
      <video id="player" controls></video>
      <div class="modal-info">
        <div class="modal-title-row">
          <div>
            <h2 id="modalTitle"></h2>
            <p id="modalArtist" class="modal-artist"></p>
          </div>
          <div class="modal-buttons">
            <button id="modalFav" class="chip-toggle">★ Favourite</button>
            <button id="modalWatched" class="chip-toggle">✓ Watched</button>
          </div>
        </div>
        <div class="tag-editor">
          <div id="modalTags" class="tag-list"></div>
          <form id="addTagForm" class="inline-form">
            <input id="addTagInput" placeholder="Add tag…" maxlength="40" aria-label="New tag" />
            <button type="submit">Add</button>
          </form>
        </div>
        <div class="playlist-add">
          <label>
            Add to playlist
            <select id="playlistSelect"></select>
          </label>
          <button id="addToPlaylistBtn">Add</button>
          <span id="playlistAddStatus" class="playlist-add-status" role="status"></span>
          <button id="removeFromPlaylistBtn" class="hidden"></button>
        </div>
      </div>
    </div>
  </div>

  <div id="aboutModal" class="modal hidden">
    <div class="modal-content about-content" role="dialog" aria-modal="true" aria-labelledby="aboutTitle">
      <button id="closeAbout" class="modal-close" title="Close" aria-label="Close">✕</button>
      <img src="apple-touch-icon.png" alt="" width="96" height="96" />
      <h2 id="aboutTitle">Music Video Cataloguer</h2>
      <p id="aboutVersion" class="about-version"></p>
      <p>Self-hosted cataloguer and player for a local music video collection.</p>
      <p id="aboutCopyright"></p>
      <p>Released under the MIT licence.</p>
      <p><a id="aboutLink" href="#" target="_blank" rel="noopener noreferrer"></a></p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
