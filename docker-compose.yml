services:

  music-video-cataloguer:
    image: jason4bury/music-video-cataloguer
    container_name: music-video-cataloguer
    labels:
      - home.group=Music
    # App settings come from E:\Docker_PC\env\music-video-cataloguer\.env:
    # SCAN_INTERVAL_MINUTES, AUTH_USERNAME, AUTH_PASSWORD, SESSION_SECRET, TRUST_PROXY.
    env_file:
      - ${ENV}/music-video-cataloguer/.env
    # Fixed container-side values. These override anything with the same name in the
    # .env file.
    environment:
      PORT: 3211
      LIBRARY_PATH: /videos
      DATA_DIR: /data
      SCAN_ON_START: "true"
    volumes:
      # Database, thumbnails and sessions.
      - ${CONFIGS}/music-video-cataloguer:/data
      # Music videos, one subfolder per artist. Read-only: the app never changes them.
      - ${MUSIC}/videos:/videos:ro
    ports:
      - 3001:3211
    restart: unless-stopped
